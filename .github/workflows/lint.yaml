name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check that nothing private reaches the public repo
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/pr-body.txt
            scripts/check-public-content.sh --text /tmp/pr-body.txt
          fi
          if git cat-file -e "$BASE" 2>/dev/null; then
            scripts/check-public-content.sh --range "$BASE..${{ github.sha }}"
          fi

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge tests
        run: yarn foundry:test

      - name: Start Anvil, deploy contracts (& generate contracts typescript output)
        run: |
          yarn chain > anvil.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -X POST http://127.0.0.1:8545 -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' && break
            sleep 1
          done
          yarn deploy

      - name: Check committed contract ABIs match the fresh deploy
        run: git diff --exit-code packages/nextjs/contracts/deployedContracts.ts

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types

      - name: Build nextjs
        run: yarn next:build
