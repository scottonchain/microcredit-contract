name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check that nothing private reaches the public repo
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # On a pull request the checked-out commit is a test merge GitHub synthesises, authored with the
          # account's email; the PR's own head is what the range must end at. On a push it is the push itself.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The description as it is now, not the event's snapshot: a footer appended on creation
          # and stripped right after must pass, and a leak left in place must fail.
          if [ -n "$PR_NUMBER" ]; then
            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .body > /tmp/pr-body.txt
            scripts/check-public-content.sh --text /tmp/pr-body.txt
          fi
          if git cat-file -e "$BASE" 2>/dev/null; then
            scripts/check-public-content.sh --range "$BASE..$HEAD_SHA"
          fi

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run Forge tests
        run: yarn foundry:test

      - name: Test the two-hop conservation check script
        run: python3 -m unittest scripts/test_two_hop_check.py -v


      - name: Test the candidate deployment verifier
        run: python3 -m unittest discover -s scripts -p 'test_verify_candidate_deployment.py' -v
      - name: Start Anvil, deploy contracts (& generate contracts typescript output)
        run: |
          yarn chain > anvil.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -X POST http://127.0.0.1:8545 -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' && break
            sleep 1
          done
          yarn deploy

      - name: Check committed contract ABIs match the fresh deploy
        run: git diff --exit-code packages/nextjs/contracts/deployedContracts.ts

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types

      - name: Build nextjs
        run: yarn next:build
